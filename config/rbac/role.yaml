apiVersion: v1
kind: ServiceAccount
metadata:
  name: fairshare-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fairshare-controller
rules:
- apiGroups: ["fairshare.io"]
  resources: ["queues", "queuebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["fairshare.io"]
  resources: ["queues/status", "queuebindings/status"]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "list", "watch", "delete"]
- apiGroups: ["policy"]
  resources: ["pods/eviction"]
  verbs: ["create", "delete"]
- apiGroups: ["events"]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fairshare-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fairshare-controller
subjects:
- kind: ServiceAccount
  name: fairshare-controller
  namespace: kube-system
