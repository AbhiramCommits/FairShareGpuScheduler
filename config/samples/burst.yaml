apiVersion: v1
kind: Namespace
metadata:
  name: tenant-a
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-b
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-c
---
apiVersion: v1
kind: Namespace
metadata:
  name: tenant-d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-a
  namespace: tenant-a
spec:
  replicas: 4
  selector:
    matchLabels: {app: burst-a}
  template:
    metadata:
      labels:
        app: burst-a
        fairshare.io/queue: tenant-a
    spec:
      schedulerName: fairshare-scheduler
      containers:
      - name: job
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            nvidia.com/gpu: "2"
          limits:
            nvidia.com/gpu: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-b
  namespace: tenant-b
spec:
  replicas: 4
  selector:
    matchLabels: {app: burst-b}
  template:
    metadata:
      labels:
        app: burst-b
        fairshare.io/queue: tenant-b
    spec:
      schedulerName: fairshare-scheduler
      containers:
      - name: job
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            nvidia.com/gpu: "2"
          limits:
            nvidia.com/gpu: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-c
  namespace: tenant-c
spec:
  replicas: 2
  selector:
    matchLabels: {app: burst-c}
  template:
    metadata:
      labels:
        app: burst-c
        fairshare.io/queue: tenant-c
    spec:
      schedulerName: fairshare-scheduler
      containers:
      - name: job
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            nvidia.com/gpu: "1"
          limits:
            nvidia.com/gpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: burst-d
  namespace: tenant-d
spec:
  replicas: 2
  selector:
    matchLabels: {app: burst-d}
  template:
    metadata:
      labels:
        app: burst-d
        fairshare.io/queue: tenant-d
    spec:
      schedulerName: fairshare-scheduler
      priorityClassName: high-priority
      containers:
      - name: job
        image: registry.k8s.io/pause:3.9
        resources:
          requests:
            nvidia.com/gpu: "2"
          limits:
            nvidia.com/gpu: "2"
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: high-priority
value: 1000000
globalDefault: false
description: "High priority tenant-d jobs."
