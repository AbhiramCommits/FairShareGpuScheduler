apiVersion: fairshare.io/v1alpha1
kind: Queue
metadata:
  name: root
spec:
  weight: 1
  guaranteed:
    nvidia.com/gpu: "32"
  borrowLimit:
    nvidia.com/gpu: "0"
  reclaimable: false
  preemptible: false
---
apiVersion: fairshare.io/v1alpha1
kind: Queue
metadata:
  name: tenant-a
spec:
  parent: root
  weight: 4
  guaranteed:
    nvidia.com/gpu: "8"
  borrowLimit:
    nvidia.com/gpu: "8"
  priorityClass: 100
  reclaimable: true
  preemptible: true
---
apiVersion: fairshare.io/v1alpha1
kind: Queue
metadata:
  name: tenant-b
spec:
  parent: root
  weight: 2
  guaranteed:
    nvidia.com/gpu: "4"
  borrowLimit:
    nvidia.com/gpu: "4"
  priorityClass: 100
  reclaimable: true
  preemptible: true
---
apiVersion: fairshare.io/v1alpha1
kind: Queue
metadata:
  name: tenant-c
spec:
  parent: root
  weight: 1
  guaranteed:
    nvidia.com/gpu: "2"
  borrowLimit:
    nvidia.com/gpu: "2"
  priorityClass: 100
  reclaimable: true
  preemptible: true
---
apiVersion: fairshare.io/v1alpha1
kind: Queue
metadata:
  name: tenant-d
spec:
  parent: root
  weight: 1
  guaranteed:
    nvidia.com/gpu: "2"
  borrowLimit:
    nvidia.com/gpu: "2"
  priorityClass: 200
  reclaimable: true
  preemptible: true
---
apiVersion: fairshare.io/v1alpha1
kind: QueueBinding
metadata:
  name: bind-tenant-a
  namespace: default
spec:
  queue: tenant-a
  namespace: tenant-a
---
apiVersion: fairshare.io/v1alpha1
kind: QueueBinding
metadata:
  name: bind-tenant-b
  namespace: default
spec:
  queue: tenant-b
  namespace: tenant-b
---
apiVersion: fairshare.io/v1alpha1
kind: QueueBinding
metadata:
  name: bind-tenant-c
