name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26.0"
  KIND_VERSION: "v0.23.0"

jobs:
  verify:
    name: Generate, vet and lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    - name: Verify generated code is current
      run: |
        make generate manifests
        git diff --exit-code || (echo "generated code is out of date; run 'make generate manifests'" && exit 1)
    - name: go vet
      run: go vet ./...
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.59.1
        args: --timeout=5m

  test:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    - name: Run tests
      run: |
        go test ./... -race -coverprofile=coverage.out -covermode=atomic
        go tool cover -func=coverage.out | tail -1
    - uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out

  bench:
    name: Benchmark harness
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    - name: Run benchmark
      run: make bench
    - uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: results/

  e2e:
    name: Kind end-to-end
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
    - name: Install kind
      run: |
        curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind
        kind version
    - name: Run end-to-end validation
      run: bash hack/e2e.sh
