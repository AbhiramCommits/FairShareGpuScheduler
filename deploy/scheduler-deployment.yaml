apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare-scheduler
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fairshare-scheduler
  template:
    metadata:
      labels:
        app: fairshare-scheduler
    spec:
      serviceAccountName: scheduler-sa
      containers:
      - name: scheduler
        image: fairshare-gpu-scheduler:latest
        command:
        - /bin/scheduler
        - --config=/etc/kubernetes/scheduler/scheduler-config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/kubernetes/scheduler
      volumes:
      - name: config
        configMap:
          name: fairshare-scheduler-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fairshare-scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1
    kind: KubeSchedulerConfiguration
    clientConnection:
      kubeconfig: /etc/kubernetes/scheduler.conf
    profiles:
    - schedulerName: fairshare-scheduler
      plugins:
        preFilter:
          enabled:
          - name: FairShareGPU
        filter:
          enabled:
          - name: FairShareGPU
        score:
          enabled:
          - name: FairShareGPU
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scheduler-sa
  namespace: kube-system
