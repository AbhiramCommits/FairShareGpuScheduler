apiVersion: apps/v1
kind: Deployment
metadata:
  name: fairshare-controller
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fairshare-controller
  template:
    metadata:
      labels:
        app: fairshare-controller
    spec:
      serviceAccountName: fairshare-controller
      containers:
      - name: controller
        image: fairshare-gpu-scheduler:latest
        command:
        - /bin/controller
        - --metrics-addr=:9090
        - --gpu-hourly-rate=2.50
        ports:
        - name: metrics
          containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: fairshare-controller
  namespace: kube-system
  labels:
    app: fairshare-controller
spec:
  selector:
    app: fairshare-controller
  ports:
  - name: metrics
    port: 9090
    targetPort: 9090
